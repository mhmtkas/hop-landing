<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get Hop</title>
<meta name="description" content="Hop: a tiny quest for ADHD brains. Get it on the App Store or Google Play." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#FFF6E6" />
<meta name="apple-itunes-app" content="app-id=6779776126" />
<!-- One link for social bios: phones go straight to their store, everything else sees both buttons. -->
<script>
  (function () {
    var IOS = "https://apps.apple.com/app/id6779776126";
    var PLAY = "https://play.google.com/store/apps/details?id=com.mehmetkas.hop";
    var ua = navigator.userAgent || "";
    // iPadOS reports a Mac user agent; touch points tell it apart from a real Mac.
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) location.replace(IOS);
    else if (isAndroid) location.replace(PLAY);
  })();
</script>
<style>
  :root { --paper:#FFF6E6; --ink:#3B2A20; --leaf:#6DBE6A; --water:#8FC9D9; --sun:#F6C35B; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--water); color:var(--ink); padding:16px;
         font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background:var(--paper); border:4px solid var(--ink); border-radius:28px; box-shadow:0 6px 0 var(--ink);
          max-width:420px; width:100%; padding:32px 24px; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; border:3px solid var(--ink); }
  h1 { font-size:32px; margin:16px 0 4px; }
  p { margin:0 0 24px; font-size:17px; }
  a.btn { display:block; margin:12px 0; padding:14px 16px; border:3px solid var(--ink); border-radius:18px;
          box-shadow:0 4px 0 var(--ink); color:var(--ink); text-decoration:none; font-weight:800; font-size:18px; }
  a.ios { background:var(--sun); }
  a.play { background:var(--leaf); }
  small { display:block; margin-top:16px; opacity:.7; }
</style>
</head>
<body>
  <main class="card">
    <img src="icon.png" alt="Hop app icon" />
    <h1>Hop</h1>
    <p>A tiny quest for ADHD brains.</p>
    <a class="btn ios" href="https://apps.apple.com/app/id6779776126">Download on the App Store</a>
    <a class="btn play" href="https://play.google.com/store/apps/details?id=com.mehmetkas.hop">Get it on Google Play</a>
    <small>On a phone this page opens your store by itself.</small>
  </main>
</body>
</html>
